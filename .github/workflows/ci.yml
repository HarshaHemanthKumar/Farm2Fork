name: Farm2Fork CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kisanconnect_test
          POSTGRES_USER: kisanuser
          POSTGRES_PASSWORD: kisanpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run migrations
        working-directory: ./backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: kisanconnect_test
          DB_USER: kisanuser
          DB_PASSWORD: kisanpass
          NODE_ENV: test
        run: npx sequelize-cli db:migrate

      - name: Run tests
        working-directory: ./backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: kisanconnect_test
          DB_USER: kisanuser
          DB_PASSWORD: kisanpass
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test_secret
          NODE_ENV: test
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_API_VERSION: "2024-04-10"
        run: npm test
